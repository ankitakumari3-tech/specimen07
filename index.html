<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Plant With No Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B2733; --ink2:#3C5C63; --mint:#EAF7F3; --em:#0E8F65; --teal:#11A69A; --gold:#E2A93B; --gold2:#FFC857; --vio:#7B5CE6; --paper:#FFFFFF;
  --u:4px; color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#0B2733; } }
:root[data-theme="dark"]{ --ink:#0B2733; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#CFE7E1;color:var(--ink);font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:relative;overflow:hidden;background:#E3F3EF;width:360px;height:640px}
#stage>*{position:absolute;inset:0}
#camwrap{z-index:1}
#world,#ov{width:100%;height:100%;display:block}
#fx{z-index:2;pointer-events:none;width:100%;height:100%}
#ov{z-index:3;opacity:0;transition:opacity .8s ease;pointer-events:none}
#vig{z-index:4;pointer-events:none;background:radial-gradient(ellipse 80% 65% at 50% 42%,transparent 60%,rgba(20,70,70,.18) 100%)}
#black{z-index:5;background:#000;opacity:0;pointer-events:none}
#sweep{z-index:5;pointer-events:none;opacity:0;background:linear-gradient(180deg,transparent 0,rgba(17,166,154,0) 40%,rgba(17,166,154,.45) 50%,rgba(17,166,154,0) 60%,transparent 100%);background-size:100% 40%;background-repeat:no-repeat}
#sweep.go{animation:sweep 1.8s ease-in-out forwards}
@keyframes sweep{0%{opacity:1;background-position:0 -60%}90%{opacity:1}100%{opacity:0;background-position:0 160%}}
/* ---- centre titles: always inside a readable box ---- */
#titles{z-index:6;display:flex;align-items:center;justify-content:center;padding:0 calc(var(--u)*6);pointer-events:none}
.tw{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.4);text-align:center;padding:calc(var(--u)*5) calc(var(--u)*5);border-radius:calc(var(--u)*5);background:rgba(7,24,36,.82);color:#fff;box-shadow:0 18px 50px rgba(0,30,40,.3);transition:opacity .5s}
.tw:empty{opacity:0;padding:0}
.tl{opacity:0;transform:translateY(calc(var(--u)*1.4));filter:blur(6px);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1),filter .8s ease;font-weight:700;letter-spacing:.06em;line-height:1.18}
.tl.on,.tl.typed{opacity:1;transform:none;filter:none}
.typed::after{content:"";display:inline-block;width:.45em;height:.08em;margin-left:.12em;background:currentColor;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.t-lab{font-size:calc(var(--u)*5);color:#6FF0DF;letter-spacing:.18em;font-weight:600}
.t-big{font-size:calc(var(--u)*8);color:#fff}
.t-mid{font-size:calc(var(--u)*6.4);color:#fff;letter-spacing:.08em}
.t-huge{font-size:calc(var(--u)*16);font-weight:800}
.t-warn{font-size:calc(var(--u)*5.2);color:#FF7A85;letter-spacing:.12em}
.t-sub{font-size:calc(var(--u)*4.8);font-weight:400;letter-spacing:0;color:#E4F7F3;line-height:1.4}
.gold{color:#FFD27A}
.chap{font-size:calc(var(--u)*8.6);font-weight:800;letter-spacing:.05em;line-height:1.12;color:#FFD27A}
.chap span{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.25em);transition:opacity .9s ease,filter 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.chap.on span{opacity:1;filter:none;transform:none}
/* ---- one caption zone at the bottom ---- */
#cap{z-index:7;inset:auto;left:4%;right:4%;bottom:calc(var(--u)*4);background:rgba(255,255,255,.95);color:var(--ink);border-radius:calc(var(--u)*4.5);padding:calc(var(--u)*3.4) calc(var(--u)*4.4);font-size:calc(var(--u)*5);line-height:1.38;font-weight:600;box-shadow:0 10px 34px rgba(10,60,60,.22);border-left:calc(var(--u)*1.4) solid var(--teal);opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .4s ease;pointer-events:none}
#cap.on{opacity:1;transform:none}
#cap .ch{display:block;font-size:calc(var(--u)*3.7);font-weight:800;letter-spacing:.14em;color:var(--em);margin-bottom:calc(var(--u)*.8)}
/* ---- HUD ---- */
#hud{z-index:9;inset:auto;top:0;left:0;right:0;padding:calc(var(--u)*3) calc(var(--u)*4);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.55));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .6s;pointer-events:none}
#hud.on{opacity:1}
#hud .h1{font-size:calc(var(--u)*3.6);letter-spacing:.18em;color:var(--em);font-weight:800}
#hud .h2{font-size:calc(var(--u)*3.2);color:var(--ink2);margin-top:calc(var(--u)*.4)}
#hud .hr{display:flex;gap:calc(var(--u)*1.6);pointer-events:auto}
.pill{white-space:nowrap;font:inherit;font-size:calc(var(--u)*3.3);font-weight:600;color:var(--ink);background:#fff;border:1.5px solid rgba(17,166,154,.45);border-radius:99px;padding:calc(var(--u)*1.3) calc(var(--u)*2.6);cursor:pointer}
.pill[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.pill.ev{color:var(--gold2);border-color:rgba(226,169,59,.7)}
#camtag{z-index:8;inset:auto;top:calc(var(--u)*14.5);left:calc(var(--u)*4);font-size:calc(var(--u)*3.8);font-weight:700;letter-spacing:.14em;color:#fff;background:rgba(7,24,36,.75);border-radius:99px;padding:calc(var(--u)*1.2) calc(var(--u)*3);opacity:0;transition:opacity .3s;pointer-events:none;display:flex;align-items:center;gap:calc(var(--u)*1.6)}
#camtag i{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);border-radius:50%;background:#FF5D73;animation:blink 1.2s steps(1) infinite}
/* ---- scanner ---- */
#scan{z-index:9;inset:auto;top:calc(var(--u)*14);right:calc(var(--u)*4);font:inherit;font-size:calc(var(--u)*4.2);font-weight:800;color:#3A2700;background:linear-gradient(90deg,#FFD27A,#FFB547);border:0;border-radius:99px;padding:calc(var(--u)*2.4) calc(var(--u)*4);box-shadow:0 0 0 0 rgba(255,181,71,.7);cursor:pointer;opacity:0;transform:scale(.8);pointer-events:none;transition:opacity .3s,transform .3s}
#scan.on{opacity:1;transform:scale(1);pointer-events:auto;animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,181,71,.75)}80%{box-shadow:0 0 0 calc(var(--u)*5) rgba(255,181,71,0)}100%{box-shadow:0 0 0 0 rgba(255,181,71,0)}}
#spark{z-index:8;inset:auto;width:60px;height:60px;border-radius:50%;border:4px solid #FFB547;box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 30px #FFB547;display:none;cursor:pointer;background:rgba(255,210,122,.18)}
#spark.on{display:block;animation:sp 1s ease-in-out infinite}
#spark::after{content:"✦";position:absolute;left:50%;top:-1.1em;transform:translateX(-50%);color:#FFB547;font-size:calc(var(--u)*7);text-shadow:0 0 10px #fff}
@keyframes sp{50%{transform:scale(1.15)}}
#toast{z-index:10;inset:auto;top:calc(var(--u)*25);left:5%;right:5%;pointer-events:none;opacity:0;transform:translateY(-8px);transition:opacity .4s,transform .4s}
#toast.on{opacity:1;transform:none}
#toast div{background:#FFF8E8;border:2px solid var(--gold);color:var(--ink);border-radius:calc(var(--u)*4);padding:calc(var(--u)*3) calc(var(--u)*4);font-size:calc(var(--u)*4);line-height:1.4;box-shadow:0 12px 30px rgba(120,80,0,.2)}
#toast b{display:block;color:var(--gold2);font-size:calc(var(--u)*4.6);margin-bottom:calc(var(--u)*.6)}
/* ---- interactive layer ---- */
#ui{z-index:8;pointer-events:none}
#ui *{pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-radius:calc(var(--u)*6) calc(var(--u)*6) 0 0;padding:calc(var(--u)*5) calc(var(--u)*5) calc(var(--u)*6);box-shadow:0 -12px 40px rgba(10,60,60,.2);opacity:0;transform:translateY(30px);transition:opacity .5s,transform .6s cubic-bezier(.2,.7,.2,1);max-height:62%;overflow:auto}
.sheet.on{opacity:1;transform:none}
.cq{font-size:calc(var(--u)*6.2);font-weight:800;letter-spacing:.04em;text-align:center}
.cs{font-size:calc(var(--u)*4.2);text-align:center;color:var(--ink2);margin:calc(var(--u)*1.2) 0 calc(var(--u)*3.6)}
.cfb{min-height:calc(var(--u)*5);font-size:calc(var(--u)*4.2);text-align:center;color:#B4532A;font-weight:600;margin-top:calc(var(--u)*2)}
.opts{display:flex;flex-direction:column;gap:calc(var(--u)*2.4)}
.opt{display:flex;align-items:center;gap:calc(var(--u)*4);padding:calc(var(--u)*2.2) calc(var(--u)*3.6);border-radius:calc(var(--u)*4);background:var(--mint);border:2px solid rgba(17,166,154,.35);color:var(--ink);font:inherit;font-size:calc(var(--u)*5);font-weight:700;text-align:left;cursor:pointer;transition:border-color .3s,box-shadow .3s,opacity .3s,transform .15s}
.opt:active{transform:scale(.98)}
.opt:focus-visible,.btn:focus-visible,.pill:focus-visible,#scan:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt .oi{flex:0 0 auto;width:calc(var(--u)*15);height:calc(var(--u)*15);border-radius:calc(var(--u)*3);background:#fff;padding:calc(var(--u)*1)}
.opt .oi svg{width:100%;height:100%}
.opt .ot b{display:block;font-size:calc(var(--u)*3.1);color:var(--teal);letter-spacing:.18em;font-weight:800;margin-bottom:calc(var(--u)*.4)}
.opt.right{border-color:var(--gold);background:#FFF6E2;box-shadow:0 0 0 2px var(--gold)}
.opt.wrong{opacity:.4;animation:shake .45s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{width:100%;padding:calc(var(--u)*3.4);border-radius:calc(var(--u)*4);font:inherit;font-size:calc(var(--u)*4.6);font-weight:700;border:0;background:linear-gradient(90deg,#11A69A,#2FC38A);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;border:2px solid rgba(11,39,51,.2);color:var(--ink)}
.bstack{display:flex;flex-direction:column;gap:calc(var(--u)*2.4);margin-top:calc(var(--u)*2)}
/* concept card */
.card{position:absolute;left:4%;right:4%;top:calc(var(--u)*14);background:rgba(255,255,255,.97);border-radius:calc(var(--u)*5);padding:calc(var(--u)*4.4) calc(var(--u)*4);box-shadow:0 18px 50px rgba(10,60,60,.25);opacity:0;transform:translateY(12px) scale(.98);transition:opacity .5s,transform .6s cubic-bezier(.2,.7,.2,1);pointer-events:none!important}
.card.on{opacity:1;transform:none}
.card h3{margin:0;font-size:calc(var(--u)*5.6);font-weight:800;letter-spacing:.06em;text-align:center}
.card .k{font-size:calc(var(--u)*3.4);text-align:center;color:var(--ink2);margin:calc(var(--u)*.8) 0 calc(var(--u)*3.4)}
.cg{display:grid;gap:calc(var(--u)*2.4)}
.panel{text-align:center;border-radius:calc(var(--u)*3.4);padding:calc(var(--u)*2.4) calc(var(--u)*1.2);background:var(--mint);border:2px solid transparent;position:relative}
.panel.hl{border-color:var(--gold);background:#FFF6E2}
.panel svg{width:100%;height:auto;display:block}
.panel b{display:block;font-size:calc(var(--u)*4);margin-top:calc(var(--u)*1.2);letter-spacing:.02em}
.panel span{display:block;font-size:calc(var(--u)*3.3);color:var(--ink2);margin-top:calc(var(--u)*.6);line-height:1.3}
.panel i{position:absolute;top:calc(var(--u)*-2.6);left:50%;transform:translateX(-50%);font-style:normal;font-size:calc(var(--u)*2.8);font-weight:800;background:var(--gold);color:#3A2700;border-radius:99px;padding:calc(var(--u)*.6) calc(var(--u)*2);white-space:nowrap;letter-spacing:.06em}
.lock{position:absolute;top:calc(var(--u)*16);left:50%;transform:translateX(-50%);text-align:center;background:rgba(7,24,36,.85);color:#fff;border-radius:calc(var(--u)*5);padding:calc(var(--u)*4) calc(var(--u)*9);opacity:0;transition:opacity .7s}
.lock.on{opacity:1}
.lock svg{width:calc(var(--u)*14);height:calc(var(--u)*14);overflow:visible}
.lock .shk{transition:transform .7s cubic-bezier(.3,1.6,.5,1);transform-origin:70% 100%;transform-box:fill-box}
.lock.open .shk{transform:translateY(-14px) rotate(28deg)}
.lk-part{font-size:calc(var(--u)*6.6);font-weight:800;letter-spacing:.14em;margin-top:calc(var(--u)*1.4)}
.lk-state{font-size:calc(var(--u)*4);letter-spacing:.32em;color:#FFD27A;margin-top:calc(var(--u)*.6)}
.bh{font-size:calc(var(--u)*5.2);font-weight:800}
.bs{font-size:calc(var(--u)*3.9);color:var(--ink2);margin:calc(var(--u)*1) 0 calc(var(--u)*3.4);line-height:1.4}
.ci{border-left:4px solid #CFE3DE;padding:calc(var(--u)*.4) 0 calc(var(--u)*.4) calc(var(--u)*3.4);margin-bottom:calc(var(--u)*3)}
.ci.got{border-color:var(--gold)}
.ci .cn{font-size:calc(var(--u)*4.3);font-weight:700}
.ci.got .cn{color:var(--gold2)}
.ci .cd{font-size:calc(var(--u)*3.8);line-height:1.45;color:var(--ink2);margin-top:calc(var(--u)*.6)}
.idb{position:absolute;left:8%;right:8%;top:38%;text-align:center;background:rgba(7,24,36,.85);color:#fff;border-radius:calc(var(--u)*5);padding:calc(var(--u)*5);opacity:0;transition:opacity .6s}
.idb.on{opacity:1}
.idl{font-size:calc(var(--u)*4);letter-spacing:.24em;color:#6FF0DF;font-weight:700}
.idv{font-size:calc(var(--u)*14);font-weight:800;margin:calc(var(--u)*1.4) 0}
.idt{height:calc(var(--u)*1.8);background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.idt i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4FE3D1,#FFD27A)}
#home{z-index:11;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(var(--u)*7) calc(var(--u)*6) calc(var(--u)*7);background:linear-gradient(180deg,rgba(234,247,243,0) 0,rgba(234,247,243,.6) 38%,rgba(255,255,255,.97) 70%);transition:opacity .7s}
#home.off{opacity:0;pointer-events:none}
#home .k{font-size:calc(var(--u)*3.6);letter-spacing:.22em;color:var(--em);font-weight:800}
#home h1{font-size:calc(var(--u)*10);line-height:1.04;margin:calc(var(--u)*2) 0 calc(var(--u)*3);font-weight:800;letter-spacing:.01em}
#home p{font-size:calc(var(--u)*4.1);line-height:1.5;color:var(--ink2);margin:0 0 calc(var(--u)*4.4)}
#home .parts{display:flex;flex-direction:column;gap:calc(var(--u)*2.2)}
.pbtn{display:flex;justify-content:space-between;align-items:center;font:inherit;font-size:calc(var(--u)*4.5);font-weight:700;color:var(--ink);background:#fff;border:2px solid rgba(17,166,154,.35);border-radius:calc(var(--u)*4);padding:calc(var(--u)*3.2) calc(var(--u)*4.2);cursor:pointer;text-align:left}
.pbtn small{display:block;font-size:calc(var(--u)*3.1);font-weight:800;color:var(--teal);letter-spacing:.18em;margin-bottom:calc(var(--u)*.4)}
.pbtn.first{background:linear-gradient(90deg,#11A69A,#2FC38A);color:#fff;border:0}
.pbtn.first small{color:#D9FFF6}
.pbtn[disabled]{opacity:.45;cursor:default}
#stage.glitch #camwrap{animation:gl .8s steps(2) both}
@keyframes gl{0%{transform:none}15%{transform:translate(-14px,4px);filter:hue-rotate(80deg) saturate(3);clip-path:inset(10% 0 40% 0)}30%{transform:translate(18px,-6px);clip-path:inset(50% 0 8% 0);filter:invert(.3)}45%{transform:translate(-6px,0);clip-path:inset(0 0 70% 0)}60%{transform:translate(10px,8px);clip-path:inset(30% 0 30% 0);filter:hue-rotate(160deg)}80%{transform:scale(1.04);clip-path:inset(70% 0 0 0);opacity:.6}100%{opacity:0;clip-path:inset(50% 0 50% 0)}}
.clue{pointer-events:none}
.clue.armed{pointer-events:all;cursor:pointer}
.pulse{animation:pls 1.4s ease-in-out infinite}
@keyframes pls{50%{opacity:.3}}
.fadeg{transition:opacity .9s ease}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;transition:transform .9s cubic-bezier(.2,1.4,.4,1),opacity .5s}
.pop.on{transform:scale(1);opacity:1}
.popl{transform-origin:left center}.popr{transform-origin:right center}
.ly{transition:transform 2s cubic-bezier(.45,0,.2,1),opacity .7s ease}
.grow{transition:stroke-dashoffset 3s cubic-bezier(.4,0,.2,1)}
#world.bp #plant *{fill:rgba(143,243,255,.05)!important;stroke:#8FF3FF!important;stroke-width:1.2px!important;stroke-opacity:1!important}
#world.bp #lab,#world.bp #chamberFx,#world.bp #glass{opacity:.12}
#lab,#chamberFx,#glass{transition:opacity 1.2s}

#cap{display:flex;gap:calc(var(--u)*3);align-items:flex-start}
#cap .av{flex:0 0 calc(var(--u)*10);height:calc(var(--u)*10)}
#cap .av svg{width:100%;height:100%}
#cap .ct{flex:1;min-width:0}
.tapme{pointer-events:none}
.tapme.live{pointer-events:all;cursor:pointer}
#ov .ly{pointer-events:none}
.twin{transition:opacity .6s}
.wilted{opacity:.22}
.xpf{position:absolute;z-index:10;left:0;right:0;top:32%;text-align:center;font-size:calc(var(--u)*9);font-weight:800;color:#E2A93B;text-shadow:0 3px 0 #fff,0 0 24px #fff;pointer-events:none;animation:xpf 1.5s ease-out forwards}
@keyframes xpf{0%{opacity:0;transform:translateY(20px) scale(.7)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-40px)}}
.cf{position:absolute;z-index:10;top:-4%;width:calc(var(--u)*2.2);height:calc(var(--u)*3.4);border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(var(--u)*195)) rotate(760deg)}}
.machine{position:absolute;left:5%;right:5%;top:calc(var(--u)*15);background:#0E2233;color:#fff;border-radius:calc(var(--u)*5);padding:calc(var(--u)*4.4);box-shadow:0 18px 50px rgba(10,40,60,.35);opacity:0;transition:opacity .5s}
.machine.on{opacity:1}
.machine h3{margin:0;font-size:calc(var(--u)*5);letter-spacing:.14em;color:#6FF0DF;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.6);justify-content:center;margin:calc(var(--u)*3) 0}
.chips span{font-size:calc(var(--u)*3.3);font-weight:700;background:rgba(111,240,223,.14);border:1px solid rgba(111,240,223,.5);border-radius:99px;padding:calc(var(--u)*1) calc(var(--u)*2.4)}
.mscreen{background:#071521;border-radius:calc(var(--u)*3);padding:calc(var(--u)*3.4);min-height:calc(var(--u)*34);font-size:calc(var(--u)*4.2);line-height:1.45}
.mscreen .spin{font-size:calc(var(--u)*5.6);font-weight:800;text-align:center;color:#FFD27A;margin-bottom:calc(var(--u)*2)}
.mscreen .no{color:#FF8A94}.mscreen .yes{color:#7DF0B0;font-weight:800}
.mscreen small{display:block;color:#9FB8C4;font-size:calc(var(--u)*3.5);margin-bottom:calc(var(--u)*1.6)}
#world .dead,#world .alive{transition:opacity 1.1s ease var(--d,0s)}
#world .alive{opacity:0}
#world.healed .dead{opacity:0}
#world.healed .alive{opacity:1}
@media (prefers-reduced-motion: reduce){.pulse,.typed::after,#scan.on,#spark.on{animation:none}}

:root{--ink:#F2FFFB;--ink2:#A9C9CF;--mint:rgba(255,255,255,.06);--em:#5BF0B0;--teal:#3FE0CF;--gold:#FFC857;--gold2:#FFC857;color-scheme:dark}
body{background:#081322;color:var(--ink)}
#stage{background:#10283C}
#vig{background:radial-gradient(ellipse 80% 65% at 50% 42%,transparent 50%,rgba(24,10,60,.5) 100%)}
#cap{background:rgba(10,22,40,.88);color:#F4FFFB;border-left-color:#3FE0CF;box-shadow:0 10px 34px rgba(0,0,0,.4),0 0 0 1px rgba(63,224,207,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#cap .ch{color:#5BF0B0}
#hud{background:linear-gradient(180deg,rgba(6,16,32,.85),rgba(6,16,32,.35))}
#hud .h1{color:#5BF0B0}#hud .h2{color:#A9C9CF}
.pill{background:rgba(255,255,255,.08);color:#F2FFFB;border-color:rgba(63,224,207,.45)}
.pill.ev{color:#FFC857;border-color:rgba(255,200,87,.6)}

<body>
<div id="stage">
  <div id="camwrap"><svg id="world" viewBox="0 0 900 1600" aria-hidden="true"></svg></div>
  <canvas id="fx"></canvas>
  <svg id="ov" viewBox="0 0 900 1600" aria-hidden="true"></svg>
  <div id="vig"></div>
  <div id="black"></div>
  <div id="sweep"></div>
  <div id="spark" role="button" aria-label="Hidden clue here"></div>
  <div id="titles"><div class="tw"></div></div>
  <div id="camtag"><i></i><span></span></div>
  <div id="cap" aria-live="polite"></div>
  <div id="ui"></div>
  <div id="hud">
    <div><div class="h1">SPECIMEN 07</div><div class="h2" id="hudPart"></div></div>
    <div class="hr">
      <button class="pill ev" id="evBtn" aria-label="Hidden clues found">◆ 0/6</button>
      <button class="pill ev" id="xpBtn" aria-label="Your XP">⚡ 0</button>
      <button class="pill" id="soundBtn" aria-label="Sound: voice and effects">🔊</button>
      <button class="pill" id="menuBtn" aria-label="Menu: restart, skip or go home">☰</button>
    </div>
  </div>
  <button id="scan" aria-label="Scan for the hidden clue">🔍 Scan</button>
  <div id="toast"></div>
  <div id="home">
    <div class="k">BOTANICAL RESEARCH LAB</div>
    <h1>The plant with no name</h1>
    <p id="homeP">Someone wiped a botanical lab. One plant survived. Help Sprout, the lab AI, find out who she is before W strikes again.<br><b>Sound on.</b></p>
    <label class="nml" for="nm">YOUR NAME, DETECTIVE</label><input id="nm" maxlength="18" autocomplete="off" placeholder="Type your name">
    <div class="parts" id="parts"></div>
    <div class="tip">Opened inside WhatsApp? Tap ⋮ and choose “Open in browser” (Chrome/Safari) for sound and Sprout’s voice.</div>
  </div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const D=Math.PI/180;
const stage=$('#stage'),world=$('#world'),camwrap=$('#camwrap'),ov=$('#ov'),capEl=$('#cap'),tw=$('#titles .tw'),ui=$('#ui'),blackEl=$('#black'),hud=$('#hud'),toastEl=$('#toast'),scanBtn=$('#scan'),spark=$('#spark');
const ABORT={abort:true};
const PARTNAMES={1:'The plant with no name',2:'The flower code',3:'The identity'};
const S={xp:0,token:0,voice:true,sound:true,found:{},unlocked:1,pass:{1:0,2:0,3:0},part:1,heart:null};
try{const d=JSON.parse(localStorage.getItem('specimen07v3')||'null');if(d){S.found=d.found||{};S.unlocked=d.unlocked||1;S.pass=d.pass||S.pass;S.xp=d.xp||0;S.name=d.name||''}}catch(e){}
function cls(e,m){if(e)e.classList[m]('on')}
function NM(){return S.name||'detective'}
function cleanName(v){return (v||'').replace(/[<>&"`\\{}]/g,'').replace(/\s+/g,' ').trim().slice(0,18)}
function save(){try{localStorage.setItem('specimen07v3',JSON.stringify({found:S.found,unlocked:S.unlocked,pass:S.pass,xp:S.xp,name:S.name}))}catch(e){}}

/* ---------- sizing ---------- */
const FX={w:360,h:640,r:1,p:[]};
function fit(){const vw=innerWidth,vh=innerHeight;let w=Math.min(vw,vh*9/16),h=w*16/9;if(h>vh){h=vh;w=h*9/16}
stage.style.width=w+'px';stage.style.height=h+'px';stage.style.setProperty('--u',(w/100)+'px');
const c=$('#fx'),r=Math.min(2,devicePixelRatio||1);c.width=w*r;c.height=h*r;FX.w=w;FX.h=h;FX.r=r}
(function(){const n=matchMedia('(prefers-reduced-motion: reduce)').matches?10:34;
for(let i=0;i<n;i++)FX.p.push({x:Math.random(),y:Math.random(),v:.00005+Math.random()*.00014,r:.8+Math.random()*1.8,ph:Math.random()*6,c:Math.random()<.5?'120,255,225':(Math.random()<.5?'255,210,120':'200,170,255')});
const ctx=$('#fx').getContext('2d');
(function f(t){ctx.setTransform(FX.r,0,0,FX.r,0,0);ctx.clearRect(0,0,FX.w,FX.h);
for(const p of FX.p){p.y-=p.v*16;if(p.y<-.02){p.y=1.02;p.x=Math.random()}const x=(p.x+Math.sin(t*.0003+p.ph)*.01)*FX.w,y=p.y*FX.h;const a=.45+.4*Math.sin(t*.001+p.ph);
ctx.fillStyle=`rgba(${p.c},${Math.max(0,a)})`;ctx.beginPath();ctx.arc(x,y,p.r,0,7);ctx.fill()}requestAnimationFrame(f)})(0)})();

/* ---------- audio ---------- */
const A={ctx:null};
function audioInit(){if(A.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const C=new AC();A.ctx=C;
A.master=C.createGain();A.master.gain.value=S.sound?.9:0;A.master.connect(C.destination);
const len=C.sampleRate*2.4,ib=C.createBuffer(2,len,C.sampleRate);for(let ch=0;ch<2;ch++){const d=ib.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
A.rev=C.createConvolver();A.rev.buffer=ib;const rg=C.createGain();rg.gain.value=.45;A.rev.connect(rg);rg.connect(A.master);
const nb=C.createBuffer(1,C.sampleRate*2,C.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;A.noise=nb;
const bb=C.createBuffer(1,C.sampleRate*4,C.sampleRate),bd=bb.getChannelData(0);let last=0;for(let i=0;i<bd.length;i++){last=(last+.02*(Math.random()*2-1))/1.02;bd[i]=last*3.2}
const g=v=>{const x=C.createGain();x.gain.value=v;return x};
A.humG=g(0);const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;lp.connect(A.humG);A.humG.connect(A.master);
[[60,.6],[120,.25],[180,.08]].forEach(([f,a])=>{const o=C.createOscillator();o.frequency.value=f;const v=g(a);o.connect(v);v.connect(lp);o.start()});
A.airG=g(0);const src=C.createBufferSource();src.buffer=bb;src.loop=true;const af=C.createBiquadFilter();af.type='lowpass';af.frequency.value=700;const lfo=C.createOscillator();lfo.frequency.value=.07;const lg=g(260);lfo.connect(lg);lg.connect(af.frequency);lfo.start();src.connect(af);af.connect(A.airG);A.airG.connect(A.master);src.start();
A.bedG=g(0);const bl=C.createBiquadFilter();bl.type='lowpass';bl.frequency.value=420;bl.connect(A.bedG);A.bedG.connect(A.master);const br=g(.25);A.bedG.connect(br);br.connect(A.rev);
[[55,.5],[55.35,.4],[82.4,.28],[110.2,.1]].forEach(([f,a])=>{const o=C.createOscillator();o.frequency.value=f;const v=g(a);o.connect(v);v.connect(bl);o.start()})}
function silentWav(){const n=8000,b=new ArrayBuffer(44+n),v=new DataView(b);const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);for(let i=0;i<n;i++)v.setUint8(44+i,128);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function unlockAudio(){audioInit();try{if(A.ctx&&A.ctx.state!=='running')A.ctx.resume();if(A.ctx){const b=A.ctx.createBuffer(1,1,22050),src=A.ctx.createBufferSource();src.buffer=b;src.connect(A.ctx.destination);src.start(0)}}catch(e){}
try{if(!A.silent){const a=new Audio(silentWav());a.loop=true;a.setAttribute('playsinline','');a.volume=.05;A.silent=a}A.silent.play().catch(()=>{})}catch(e){}
if(window.speechSynthesis){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&A.ctx&&A.ctx.state!=='running'){try{A.ctx.resume()}catch(e){}}});
function amb(o,s=2){if(!A.ctx)return;const n=A.ctx.currentTime;for(const k in o){const G=A[k+'G'];if(!G)continue;G.gain.cancelScheduledValues(n);G.gain.setValueAtTime(G.gain.value,n);G.gain.linearRampToValueAtTime(o[k],n+s)}}
function tone(f,d,type='sine',gv=.1,when=0,rev=.3,to){if(!A.ctx)return;const C=A.ctx,t=C.currentTime+when;const o=C.createOscillator(),v=C.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(gv,t+.012);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(A.master);if(rev){const r=C.createGain();r.gain.value=rev;v.connect(r);r.connect(A.rev)}o.start(t);o.stop(t+d+.05)}
function noiseHit(d,f0,f1,gv,when=0,q=1.2){if(!A.ctx)return;const C=A.ctx,t=C.currentTime+when;const s=C.createBufferSource();s.buffer=A.noise;const bp=C.createBiquadFilter();bp.type='bandpass';bp.Q.value=q;bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(f1,t+d);const v=C.createGain();v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(gv,t+d*.45);v.gain.linearRampToValueAtTime(0,t+d);s.connect(bp);bp.connect(v);v.connect(A.master);const r=C.createGain();r.gain.value=.35;v.connect(r);r.connect(A.rev);s.start(t);s.stop(t+d+.05)}
const sfx={
 tick(){tone(2300,.025,'square',.016,0,0)},
 click(){tone(1500,.09,'sine',.07,0,.3);tone(2250,.06,'sine',.035,.035,.3)},
 beep(){tone(1760,.09,'sine',.05,0,.2);tone(2093,.09,'sine',.045,.12,.2)},
 soft(){tone(233,.3,'triangle',.07,0,.3);tone(208,.4,'triangle',.05,.13,.3)},
 unlock(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,1,'sine',.06,i*.08,.7))},
 chime(){[987.8,1318.5,1975.5].forEach((f,i)=>tone(f,1.2,'sine',.055,i*.07,.8))},
 whoosh(gv=.3){noiseHit(1.1,260,2600,gv)},
 buzz(){tone(98,.18,'sawtooth',.05,0,0);noiseHit(.15,3000,1500,.08)},
 thump(gv=.5){tone(72,.28,'sine',gv,0,.15,36)},
 glitch(){for(let i=0;i<9;i++)tone(120+Math.random()*1800,.05,'square',.045,i*.07,0);noiseHit(.7,4000,300,.28,0,.4)},
 swell(){[110,164.8,220,329.6].forEach((f,i)=>{if(!A.ctx)return;const C=A.ctx,t=C.currentTime;const o=C.createOscillator(),v=C.createGain();o.frequency.value=f;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.035,t+2+i*.25);v.gain.linearRampToValueAtTime(0,t+6);o.connect(v);v.connect(A.master);const r=C.createGain();r.gain.value=.6;v.connect(r);r.connect(A.rev);o.start(t);o.stop(t+6.2)})}
};
function heart(on){clearInterval(S.heart);S.heart=null;if(on){const b=()=>{sfx.thump(.45);setTimeout(()=>sfx.thump(.28),250)};b();S.heart=setInterval(b,1150)}}

/* ---------- narration ---------- */
let VOICE=null;
function pickVoice(){if(!window.speechSynthesis)return;const vs=speechSynthesis.getVoices();if(!vs.length)return;
const pref=[/en-IN.*(Natural|Neural)/i,/(Natural|Neural).*(India)/i,/Google UK English Male/i,/Daniel/i,/Rishi/i,/en-GB.*(Natural|Neural)/i,/(Natural|Neural)/i,/Google UK English Female/i];
for(const re of pref){const v=vs.find(v=>/^en/i.test(v.lang)&&(re.test(v.name)||re.test(v.lang+' '+v.name)));if(v){VOICE=v;return}}
VOICE=vs.find(v=>/^en-(GB|IN)/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text){return new Promise(res=>{if(!S.voice||!window.speechSynthesis)return res();let done=false;const fin=()=>{if(!done){done=true;res()}};
try{const u=new SpeechSynthesisUtterance(text.replace(/…/g,'...').replace(/’/g,"'").replace(/🔍/g,''));u.rate=1.02;u.pitch=1;if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang='en-GB';u.onend=fin;u.onerror=fin;setTimeout(fin,1800+text.length*80);speechSynthesis.speak(u)}catch(e){fin()}})}

/* ---------- timing + text ---------- */
function wait(ms){const t=S.token;return new Promise((res,rej)=>setTimeout(()=>t===S.token?res():rej(ABORT),ms))}
const AV=`<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 10 C20 5 24 1 30 2 C29 7 25 10 20 10Z" fill="#2FBF85"/><path d="M20 10 C20 6 16 2 11 3 C12 8 16 10 20 10Z" fill="#5BEAAA"/><circle cx="20" cy="24" r="14" fill="#11A69A"/><rect x="9.5" y="18" width="21" height="11.5" rx="5.7" fill="#F2FFFB"/><circle cx="15.5" cy="23.6" r="2.5" fill="#6FF0DF"/><circle cx="24.5" cy="23.6" r="2.5" fill="#6FF0DF"/></svg>`;
function capShow(t,head,av){capEl.classList.remove('on');clearTimeout(capShow.tm);capShow.tm=setTimeout(()=>{capEl.innerHTML=(av?`<div class="av">${AV}</div>`:'')+`<div class="ct">${head?`<span class="ch">${head}</span>`:''}${t}</div>`;capEl.classList.add('on')},140)}
function capOff(){clearTimeout(capShow.tm);capEl.classList.remove('on')}
async function say(text,hold=350,head='SPROUT'){const t=S.token;const titled=tw.children.length>0;if(!titled)capShow(text,head,head==='SPROUT');const words=text.split(/\s+/).length;
await Promise.all([new Promise(r=>setTimeout(r,Math.max(1300,words*300+300))),speak(text)]);if(t!==S.token)throw ABORT;await wait(hold)}
function tLine(text,cls='t-big'){capOff();const d=document.createElement('div');d.className='tl '+cls;d.textContent=text;tw.appendChild(d);requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('on')));return d}
function tClear(ms=500){[...tw.children].forEach(e=>{e.classList.remove('on','typed')});return wait(ms).then(()=>{tw.innerHTML=''})}
async function typeLine(text,cls){capOff();const d=document.createElement('div');d.className='tl typed '+cls;tw.appendChild(d);for(const ch of text){d.textContent+=ch;if(ch!==' ')sfx.tick();await wait(42)}return d}
function black(on,ms=900){blackEl.style.transition=`opacity ${ms}ms ease`;blackEl.style.opacity=on?1:0;return wait(ms)}
function camTag(t){const c=$('#camtag');if(!t){c.style.opacity=0;return}c.querySelector('span').textContent=t;c.style.opacity=1;sfx.click()}
function toast(title,body,ms=4800){toastEl.innerHTML=`<div><b>${title}</b>${body}</div>`;toastEl.classList.add('on');clearTimeout(toast.tm);toast.tm=setTimeout(()=>toastEl.classList.remove('on'),ms)}

/* ---------- camera (focus point sits at 40% height, above the caption zone) ---------- */
const cam={x:450,y:800,s:1,blur:0};
function applyCam(){const g=document.getElementById('cam');if(g)g.setAttribute('transform',`translate(450 640) scale(${cam.s}) translate(${-cam.x} ${-cam.y})`);camwrap.style.filter=cam.blur>.15?`blur(${cam.blur.toFixed(2)}px)`:'none'}
function setCam(o){Object.assign(cam,o);applyCam()}
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function camTo(o,dur=2400){const t=S.token,f={...cam};return new Promise((res,rej)=>{const st=performance.now();(function step(n){if(t!==S.token)return rej(ABORT);const k=Math.min(1,(n-st)/dur),e=ease(k);
for(const key in o){cam[key]=key==='s'?f.s*Math.pow(o.s/f.s,e):f[key]+(o[key]-f[key])*e}applyCam();k<1?requestAnimationFrame(step):res()})(st)})}

/* ---------- drawing helpers ---------- */
const sx=y=>450+5*Math.sin((1020-y)/110);
const NODES=[950,872,796,724,656,594,538],LL=[165,158,148,135,120,104,86];
const f1=n=>(+n).toFixed(1);
function leafPath(L,W){return `M0 0 C${f1(L*.16)} ${f1(-W*.64)} ${f1(L*.64)} ${f1(-W*.62)} ${L} 0 C${f1(L*.64)} ${f1(W*.62)} ${f1(L*.16)} ${f1(W*.64)} 0 0Z`}
function veins(L,W,op=.55,col='#C8FAE0'){let s=`<path d="M2 0 L${f1(L*.95)} 0" stroke="${col}" stroke-opacity="${op}" stroke-width="${f1(L/90)}" fill="none" stroke-linecap="round"/>`;
for(let k=1;k<=5;k++){const x=L*k/6.4,w=W*.4*(1-k/7.2);s+=`<path d="M${f1(x)} 0 Q${f1(x+L*.05)} ${f1(-w*.55)} ${f1(x+L*.14)} ${f1(-w)} M${f1(x)} 0 Q${f1(x+L*.05)} ${f1(w*.55)} ${f1(x+L*.14)} ${f1(w)}" stroke="${col}" stroke-opacity="${op*.65}" stroke-width="${f1(L/170)}" fill="none"/>`}return s}
function leafAt(L,W,fill='url(#gLeaf)',stroke='#0A5A40'){return `<path d="${leafPath(L,W)}" fill="${fill}" stroke="${stroke}" stroke-width="${f1(L/110)}"/>${veins(L,W)}`}
function flowerFace(r){let s='';for(let k=0;k<5;k++){s+=`<path d="M0 0 L${f1(r*.95)} ${f1(-r*.16)} L${f1(r*1.05)} 0 L${f1(r*.95)} ${f1(r*.16)}Z" transform="rotate(${k*72+36})" fill="url(#gSep)"/>`}
for(let k=0;k<5;k++)s+=`<ellipse cx="${f1(r*.52)}" cy="0" rx="${f1(r*.5)}" ry="${f1(r*.34)}" transform="rotate(${k*72})" fill="url(#gPet)" stroke="#6A4BD8" stroke-opacity=".35" stroke-width="${f1(r/40)}"/>`;
s+=`<circle r="${f1(r*.55)}" fill="url(#gPet)"/>`;for(let k=0;k<5;k++)s+=`<path d="M0 0 L${f1(r*.95)} 0" transform="rotate(${k*72})" stroke="#fff" stroke-opacity=".45" stroke-width="${f1(r/30)}"/>`;

for(let i=0;i<4;i++){const[id,lb,head,line]=q[i];
 if(i<3){await inst(i?'Tap again. Peel the next layer!':'Tap the flower to peel its outer layer.');await waitTap(['flTap'],'flTap')}

 L.forEach((x,j)=>W(x).style.opacity=j===i||i===3&&j===3?1:.35);setOp(lb,1);
 if(i>=2)arm('p2b',true);await wait(900);xp(5);
 await say(line,300,head)}
arm('p2a',true);W('ovWall').setAttribute('opacity',.45);W('ovIn').setAttribute('opacity',1);sfx.swell();
await say('Wait. Something’s glowing inside the ovary…',200);
await huntPause('p2a',4200);W('ovWall').setAttribute('opacity',.95);W('ovIn').setAttribute('opacity',.08);arm('p2a',false);arm('p2b',false)}
